services:
  db:
    image: postgres:17-alpine
    env_file: .env.docker
    ports:
      - "5436:5432"
    volumes:
      - postgres-data: {}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env.docker
    environment:
      - APP_ENV=docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8004:8000"
    restart: unless-stopped

volumes:
  postgres-data: {}
